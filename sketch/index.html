<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pin Wall sketch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@900&family=VT323&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --a: #ff2bd6; --b: #b6ff2e; --c: #22e6ff; --d: #7b2cff; --y: #ffe14a; --bg: #07040b; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #view { position: absolute; inset: 0; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); left: 50%; top: 50%; transform-origin: center; }
  .comp { position: absolute; inset: 0; }

  .rays { position: absolute; left: -500px; top: -900px; width: 3000px; height: 3000px;
    background: repeating-conic-gradient(from 0deg at 1500px 1450px, color-mix(in srgb, var(--a) 16%, transparent) 0 4deg, transparent 4deg 12deg); }
  .dots { position: absolute; inset: 0;
    background-image: radial-gradient(circle, color-mix(in srgb, var(--c) 55%, transparent) 1.6px, transparent 2.2px);
    background-size: 14px 14px;
    -webkit-mask-image: radial-gradient(ellipse 55% 60% at 22% 70%, #000 0%, transparent 70%);
            mask-image: radial-gradient(ellipse 55% 60% at 22% 70%, #000 0%, transparent 70%); opacity: .7; }
  .bigtype { position: absolute; left: -40px; top: 360px; font: 340px/0.8 Anton, sans-serif; letter-spacing: -6px;
    color: transparent; -webkit-text-stroke: 3px color-mix(in srgb, var(--b) 45%, transparent); white-space: nowrap; }

  .pin { position: absolute; }
  .pin img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .pin.shadow { filter: drop-shadow(0 18px 30px rgba(0,0,0,.7)); }
  .plates { filter: drop-shadow(7px 0 0 color-mix(in srgb, var(--a) 85%, transparent)) drop-shadow(-7px 0 0 color-mix(in srgb, var(--c) 85%, transparent)) drop-shadow(0 22px 40px rgba(0,0,0,.8)); }
  .tape::before, .tape::after { content: ""; position: absolute; width: 130px; height: 34px; background: color-mix(in srgb, var(--y) 70%, transparent); z-index: 2; mix-blend-mode: normal; }
  .tape::before { top: -16px; left: 18%; transform: rotate(-6deg); }
  .tape::after { bottom: -14px; right: 14%; transform: rotate(4deg); }
  .sticker { border: 10px solid #fff; border-radius: 28px; overflow: hidden; }
  .circle img { border-radius: 50%; }
  .circle { border-radius: 50%; outline: 6px solid var(--b); outline-offset: 8px; }
  .duo { position: relative; }
  .duo img { filter: grayscale(1) contrast(1.6) brightness(1.05); }
  .duo::after { content: ""; position: absolute; inset: 0; background: var(--d); mix-blend-mode: screen; }
  .duo::before { content: ""; position: absolute; inset: 0; z-index: 1; mix-blend-mode: multiply;
    background-image: radial-gradient(circle, var(--a) 2.4px, transparent 3px); background-size: 9px 9px; }

  .win { background: #c0c0c0; padding: 4px; box-shadow: inset -2px -2px #404040, inset 2px 2px #fff, 0 20px 40px rgba(0,0,0,.7); }
  .win .bar { height: 30px; background: linear-gradient(90deg, #0a1a8a, #1084d0); color: #fff; font: 24px/30px VT323, monospace; padding: 0 8px; display: flex; justify-content: space-between; }
  .win .bar b { font-weight: 400; letter-spacing: 1px; }
  .win .btns span { display: inline-block; width: 22px; height: 20px; margin: 5px 0 0 3px; background: #c0c0c0; color: #000; font: 18px/20px VT323; text-align: center; box-shadow: inset -1px -1px #404040, inset 1px 1px #fff; }
  .win .body { position: absolute; left: 4px; right: 4px; top: 38px; bottom: 4px; }

  .mast { position: absolute; left: 56px; top: 30px; z-index: 30; }
  .mast .time { font: 250px/0.86 Anton, sans-serif; color: var(--b); letter-spacing: -4px;
    text-shadow: 6px 0 var(--a), -6px 0 var(--c); }
  .mast .line { font: 700 26px/1 "Space Mono", monospace; color: #fff; background: #000; display: inline-block; padding: 8px 12px; margin-top: 10px; letter-spacing: 2px; }
  .mast .line i { color: var(--a); font-style: normal; }
  .kanji { position: absolute; left: 600px; top: 40px; z-index: 30; writing-mode: vertical-rl; font: 900 74px/1 "Noto Sans JP", sans-serif; color: #fff; background: var(--a); padding: 10px 6px; }
  .barcode { position: absolute; left: 700px; top: 50px; z-index: 30; width: 46px; height: 150px; background: repeating-linear-gradient(0deg, #fff 0 3px, transparent 3px 5px, #fff 5px 6px, transparent 6px 10px, #fff 10px 14px, transparent 14px 16px); }

  .np { position: absolute; right: 50px; bottom: 44px; z-index: 30; text-align: right; }
  .np .tag { font: 700 22px/1 "Space Mono", monospace; color: #000; background: var(--b); display: inline-block; padding: 6px 10px; letter-spacing: 3px; }
  .np .title { font: 92px/0.9 Anton, sans-serif; color: #fff; text-transform: uppercase; margin-top: 8px; text-shadow: 5px 5px 0 var(--d); }
  .np .chips { display: flex; justify-content: flex-end; gap: 6px; margin-top: 12px; }
  .np .chips span { width: 46px; height: 22px; }

  .holo { transform: rotate(3deg) scale(1.1) translateY(-26px) !important; z-index: 25 !important;
    filter: drop-shadow(0 50px 50px rgba(0,0,0,.9)); }
  .holo::after { content: ""; position: absolute; inset: 0; width: auto; height: auto; transform: none; background-color: transparent; z-index: 3; mix-blend-mode: overlay; opacity: .8;
    background: linear-gradient(115deg, transparent 20%, rgba(255,255,255,.7) 32%, transparent 40%),
      conic-gradient(from 200deg at 70% 30%, #ff2bd6, #ffe14a, #b6ff2e, #22e6ff, #7b2cff, #ff2bd6); }
  .cursor { position: absolute; z-index: 60; width: 0; height: 0; border-left: 18px solid #fff; border-bottom: 26px solid transparent; transform: rotate(-20deg); filter: drop-shadow(2px 2px 0 #000); }

  .slam { position: absolute; z-index: 55; width: 380px; height: 380px; transform: translate(-50%, -50%) rotate(-8deg); }
  .slam .star { position: absolute; inset: 0; background: var(--y);
    clip-path: polygon(50% 0%, 58% 30%, 85% 8%, 70% 38%, 100% 35%, 74% 54%, 98% 78%, 66% 68%, 62% 100%, 48% 72%, 26% 96%, 32% 64%, 0% 70%, 24% 50%, 2% 24%, 34% 34%, 22% 4%, 44% 28%); }
  .slam .star.back { background: #000; transform: translate(12px, 12px); }
  .slam b { position: absolute; inset: 0; display: grid; place-items: center; font: 900 120px/1 "Noto Sans JP"; color: #000; -webkit-text-stroke: 2px #000; }
  .ring { position: absolute; z-index: 54; border: 6px solid #fff; border-radius: 50%; transform: translate(-50%, -50%); opacity: .8; }

  .shard { position: absolute; inset: 0; }
  .flash { position: absolute; inset: 0; z-index: 70; pointer-events: none;
    background: radial-gradient(circle at 1000px 560px, #fff 0 40px, color-mix(in srgb, #fff 60%, transparent) 90px, transparent 260px); }
  .speed { position: absolute; inset: 0; z-index: 69; pointer-events: none;
    background: repeating-conic-gradient(from 0deg at 1000px 560px, rgba(255,255,255,.55) 0 .6deg, transparent .6deg 7deg);
    -webkit-mask-image: radial-gradient(circle at 1000px 560px, transparent 280px, #000 700px);
            mask-image: radial-gradient(circle at 1000px 560px, transparent 280px, #000 700px); }

  #ui { position: fixed; left: 12px; bottom: 12px; z-index: 100; display: flex; gap: 6px; font: 14px system-ui; }
  #ui button { background: #111; color: #ddd; border: 1px solid #444; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  #ui button.on { background: var(--b); color: #000; border-color: var(--b); }
</style>
</head>
<body>
<div id="view"><div id="stage"></div></div>
<div id="ui">
  <button data-f="calm">1 · calm</button>
  <button data-f="touch">2 · hover + click</button>
  <button data-f="drop">3 · drop</button>
</div>

let FILES = {};
// [id, x, y, w, h, rot, style, extra]
const SLOTS = [
  ['212', 520, 110, 300, 400, -9, 'duo'],
  ['184', 330, 300, 360, 270, 4, 'shadow torn'],
  ['216', 50, 420, 390, 520, -5, 'shadow tape'],
  ['159', 1640, 30, 250, 340, 5, 'shadow'],
  ['033', 1290, 70, 440, 330, 2, 'win', '033.JPG - Paint'],
  ['003', 1040, 26, 280, 220, -3, 'win', 'SIGNAL.GIF'],
  ['154', 1430, 420, 370, 470, 6, 'shadow tape', 'hover'],
  ['098', 640, 880, 560, 180, -1, 'shadow torn'],
  ['019', 420, 640, 300, 300, 0, 'circle shadow'],
  ['001', 1180, 690, 300, 300, -8, 'sticker shadow'],
  ['142', 1720, 760, 230, 230, -4, 'duo'],
  ['227', 30, 860, 330, 240, 3, 'shadow tape'],
  ['063', 820, 150, 640, 780, -3, 'plates', 'hero'],
];

function src(id) { return PIN + FILES[id]; }
function jag(seed) {            // torn-paper polygon
  let s = seed * 9301 % 233280, r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const p = [];
  for (let i = 0; i <= 24; i++) p.push(`${i / 24 * 100}% ${r() * 5}%`);
  for (let i = 1; i <= 16; i++) p.push(`${100 - r() * 4}% ${i / 16 * 100}%`);
  for (let i = 23; i >= 0; i--) p.push(`${i / 24 * 100}% ${100 - r() * 5}%`);
  for (let i = 15; i >= 1; i--) p.push(`${r() * 4}% ${i / 16 * 100}%`);
  return `polygon(${p.join(',')})`;
}

function buildComp(frame) {
  const c = document.createElement('div'); c.className = 'comp';
  c.innerHTML = `<div class="rays"></div><div class="dots"></div><div class="bigtype">SICK IMAGES</div>`;
  SLOTS.forEach(([id, x, y, w, h, rot, style, extra], i) => {
    const d = document.createElement('div');
    d.className = 'pin ' + style + (extra === 'hover' && frame === 'touch' ? ' holo' : '');
    Object.assign(d.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px', transform: `rotate(${rot}deg)`, zIndex: extra === 'hero' ? 20 : i + 1 });
    if (style.includes('win')) {
      d.innerHTML = `<div class="bar"><b>${extra}</b><span class="btns"><span>_</span><span>□</span><span>x</span></span></div><div class="body"><img src="${src(id)}"></div>`;
    } else {
      d.innerHTML = `<img src="${src(id)}">`;
    }
    if (style.includes('torn')) d.firstChild.style.clipPath = jag(i + 3);
    c.appendChild(d);
  });
  c.insertAdjacentHTML('beforeend', `
    <div class="mast"><div class="time">22:41</div>
      <div class="line">SICK IMAGES <i>///</i> ISSUE 255 <i>///</i> SUN 16 NOV 2026</div></div>
    <div class="kanji">深夜</div><div class="barcode"></div>
    <div class="np"><div class="tag">NOW PLAYING</div>
      <div class="title">Adrenaline<br>Deadcrow remix</div>
      <div class="chips"><span style="background:var(--a)"></span><span style="background:var(--b)"></span><span style="background:var(--c)"></span><span style="background:var(--d)"></span><span style="background:var(--y)"></span></div></div>`);
  return c;
}

function render(frame) {
  const st = document.getElementById('stage'); st.innerHTML = '';
  document.querySelectorAll('#ui button').forEach(b => b.classList.toggle('on', b.dataset.f === frame));
  if (frame !== 'drop') {
    st.appendChild(buildComp(frame));
    if (frame === 'touch') {
      st.insertAdjacentHTML('beforeend', `
        <div class="cursor" style="left:1640px;top:640px"></div>
        <div class="ring" style="left:1010px;top:800px;width:520px;height:520px"></div>
        <div class="ring" style="left:1010px;top:800px;width:700px;height:700px;opacity:.35;border-width:3px"></div>
        <div class="slam" style="left:1010px;top:800px"><div class="star back"></div><div class="star"></div><b>ドン</b></div>`);
    }
    return;
  }
  // drop: shatter the composition into shards flying out from the centre
  const cx = 1000, cy = 560, N = 15;
  let s = 7, r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const angs = [];
  for (let i = 0; i < N; i++) angs.push((i + r() * 0.7) / N * Math.PI * 2);
  const edge = a => { const dx = Math.cos(a), dy = Math.sin(a); const t = Math.min(dx ? Math.abs((dx > 0 ? 1920 - cx : cx) / dx) : 1e9, dy ? Math.abs((dy > 0 ? 1080 - cy : cy) / dy) : 1e9); return [cx + dx * t * 1.4, cy + dy * t * 1.4]; };
  for (let i = 0; i < N; i++) {
    const a0 = angs[i], a1 = angs[(i + 1) % N] + (i === N - 1 ? Math.PI * 2 : 0), am = (a0 + a1) / 2;
    const rin = 60 + r() * 120;
    const [x0, y0] = edge(a0), [x1, y1] = edge(a1), [xm, ym] = edge(am);
    const pts = [[cx + Math.cos(a0) * rin, cy + Math.sin(a0) * rin], [x0, y0], [xm, ym], [x1, y1], [cx + Math.cos(a1) * rin, cy + Math.sin(a1) * rin]];
    const sh = document.createElement('div'); sh.className = 'shard';
    sh.style.clipPath = `polygon(${pts.map(p => `${p[0]}px ${p[1]}px`).join(',')})`;
    const push = 40 + r() * 110, rot = (r() - .5) * 10;
    sh.style.transform = `translate(${Math.cos(am) * push}px, ${Math.sin(am) * push}px) rotate(${rot}deg) scale(${1.02 + r() * .06})`;
    sh.style.transformOrigin = `${cx}px ${cy}px`;
    if (i % 4 === 1) sh.style.filter = 'hue-rotate(160deg) saturate(1.6)';
    if (i % 5 === 3) sh.style.filter = 'invert(1) hue-rotate(180deg)';
    sh.appendChild(buildComp('drop'));
    st.appendChild(sh);
  }
  st.insertAdjacentHTML('beforeend', `<div class="speed"></div><div class="flash"></div>`);
}

function fit() { const st = document.getElementById('stage'); const k = Math.min(innerWidth / 1920, innerHeight / 1080); st.style.transform = `translate(-50%, -50%) scale(${k})`; }
addEventListener('resize', fit);
document.querySelectorAll('#ui button').forEach(b => b.onclick = () => { history.replaceState(null, '', '?f=' + b.dataset.f); render(b.dataset.f); });
addEventListener('keydown', e => { const f = { 1: 'calm', 2: 'touch', 3: 'drop' }[e.key]; if (f) render(f); });

(async () => {
  for (const f of LIST) FILES[f.slice(0, 3)] = f;
  if (new URLSearchParams(location.search).get('shot')) document.getElementById('ui').style.display = 'none';
  fit(); render(new URLSearchParams(location.search).get('f') || 'calm');
})();
</script>
